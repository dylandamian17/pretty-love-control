<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control BLE Directo - Pretty Love</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; max-width: 400px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { width: 100%; padding: 16px; margin: 8px 0; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-conn { background: #03dac6; color: #000; }
        .btn-lvl { background: #3700b3; color: #fff; }
        .btn-off { background: #cf6679; color: #000; margin-top: 15px; }
        #status { margin-top: 15px; font-weight: bold; color: #bb86fc; font-size: 13px; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h2>Control BLE Directo</h2>
    
    <button class="btn-conn" onclick="conectarBLE()">1. Conectar por Bluetooth</button>

    <h3>Niveles</h3>
    <button class="btn-lvl" onclick="enviarComando(0x01)">Nivel 1</button>
    <button class="btn-lvl" onclick="enviarComando(0x02)">Nivel 2</button>
    <button class="btn-lvl" onclick="enviarComando(0x03)">Nivel 3 (Máximo)</button>

    <button class="btn-off" onclick="enviarComando(0x00)">Apagar</button>

    <div id="status">Desconectado</div>
</div>

<script>
    let bluetoothDevice;
    let targetCharacteristic = null;

    async function conectarBLE() {
        const status = document.getElementById('status');
        try {
            status.innerText = "Buscando dispositivos...";
            
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [
                    '0000ffe0-0000-1000-8000-00805f9b34fb', 
                    '0000fff0-0000-1000-8000-00805f9b34fb',
                    '0000180a-0000-1000-8000-00805f9b34fb',
                    '0000ffe5-0000-1000-8000-00805f9b34fb'
                ]
            });

            status.innerText = "Conectando al GATT...";
            const server = await bluetoothDevice.gatt.connect();
            
            status.innerText = "Escaneando servicios y características...";
            const services = await server.getPrimaryServices();
            
            for (let service of services) {
                const characteristics = await service.getCharacteristics();
                for (let characteristic of characteristics) {
                    // Buscamos cualquier canal que soporte escritura (write o writeWithoutResponse)
                    if (characteristic.properties.write || characteristic.properties.writeWithoutResponse) {
                        targetCharacteristic = characteristic;
                        break;
                    }
                }
                if (targetCharacteristic) break;
            }

            if (targetCharacteristic) {
                status.innerText = "¡Canal de escritura hallado! Listo.";
            } else {
                status.innerText = "Error: El dispositivo no expone canales de escritura.";
            }

        } catch (error) {
            console.error(error);
            status.innerText = "Error: " + error.message;
        }
    }

    async function enviarComando(nivel) {
        if (!targetCharacteristic) {
            alert("Primero conéctate al dispositivo.");
            return;
        }
        try {
            // Paquete de bytes estándar de control para Aogu / Pretty Love
            const comando = new Uint8Array([0x0b, nivel]);
            await targetCharacteristic.writeValue(comando);
            document.getElementById('status').innerText = "Comando enviado. Nivel: " + nivel;
        } catch (error) {
            console.error(error);
            // Si el comando estándar falla, intentamos un paquete alternativo de longitud mínima
            try {
                const comandoAlt = new Uint8Array([nivel]);
                await targetCharacteristic.writeValue(comandoAlt);
                document.getElementById('status').innerText = "Enviado (Alt). Nivel: " + nivel;
            } catch (errAlt) {
                status.innerText = "Error al escribir en el canal.";
            }
        }
    }
</script>
</body>
</html>
