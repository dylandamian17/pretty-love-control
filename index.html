<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control BDSM - v2</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .caja { background: #1e1e1e; padding: 20px; border-radius: 10px; margin: 15px auto; max-width: 400px; }
        button { background: #6200ea; color: white; border: none; padding: 15px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 10px; }
        button:active { background: #3700b3; }
        .peligro { background: #cf6679; }
        .peligro:active { background: #b00020; }
        .ruleta { background: #ff9800; color: #000; font-weight: bold; }
        input[type=range] { width: 100%; margin: 15px 0; }
        #controles { display: none; }
        #estado { font-style: italic; color: #03dac6; margin-bottom: 20px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/buttplug@3.0.0/dist/web/buttplug.min.js"></script>
</head>
<body>

    <h2>Panel BDSM - Pretty Love</h2>
    
    <div id="estado">Esperando conexión...</div>
    <button id="btn-conectar">Vincular Juguete</button>

    <div id="controles">
        <!-- Control de Vibración -->
        <div class="caja">
            <label>Intensidad Vibración: <span id="val-vib">50</span>%</label>
            <input type="range" id="rango-vib" min="1" max="100" value="50">
            <button id="btn-vibrar">Vibrar (2s)</button>
        </div>

        <!-- Control de Shock -->
        <div class="caja">
            <label>Intensidad Shock: <span id="val-shock">30</span>%</label>
            <input type="range" id="rango-shock" min="1" max="100" value="30">
            <button id="btn-shock" class="peligro">Shock Eléctrico (1s)</button>
        </div>

        <!-- Dinámica -->
        <div class="caja">
            <button id="btn-ruleta" class="ruleta">🎲 Ruleta Rusa</button>
            <p id="msg-ruleta" style="font-size: 14px; color: #aaa;">Presiona bajo tu propio riesgo...</p>
        </div>

        <button id="btn-detener" style="background: #333;">Detener Todo</button>
    </div>

    <script>
        let jugueteActivo = null;

        // Actualizar los números de los sliders en pantalla
        document.getElementById('rango-vib').oninput = function() { document.getElementById('val-vib').innerText = this.value; }
        document.getElementById('rango-shock').oninput = function() { document.getElementById('val-shock').innerText = this.value; }

        document.getElementById('btn-conectar').addEventListener('click', async () => {
            const cliente = new Buttplug.ButtplugClient("Mi App");
            const conector = new Buttplug.ButtplugEmbeddedClientConnector();
            
            try {
                document.getElementById('estado').innerText = "Buscando...";
                await cliente.connect(conector);
                
                cliente.addListener("deviceadded", async (dispositivo) => {
                    jugueteActivo = dispositivo;
                    document.getElementById('estado').innerText = `Conectado: ${dispositivo.Name}`;
                    document.getElementById('controles').style.display = "block";
                    document.getElementById('btn-conectar').style.display = "none";
                    await cliente.stopScanning();
                });

                await cliente.startScanning();
            } catch (error) {
                document.getElementById('estado').innerText = "Error: " + error.message;
            }
        });

        // Función auxiliar para enviar comandos leyendo los sliders
        async function disparar(actuador, tiempoMs) {
            if (!jugueteActivo) return;
            // Lee el valor del slider (0 a 100) y lo convierte a formato Buttplug (0.0 a 1.0)
            let intensidad = (actuador === 0) ? document.getElementById('rango-vib').value / 100 : document.getElementById('rango-shock').value / 100;
            
            await jugueteActivo.vibrate([{ Index: actuador, Speed: intensidad }]);
            setTimeout(() => jugueteActivo.stop(), tiempoMs);
        }

        // Eventos de los botones manuales
        document.getElementById('btn-vibrar').addEventListener('click', () => disparar(0, 2000));
        document.getElementById('btn-shock').addEventListener('click', () => disparar(1, 1000));
        document.getElementById('btn-detener').addEventListener('click', async () => { if(jugueteActivo) await jugueteActivo.stop(); });

        // Lógica de la Ruleta Rusa
        document.getElementById('btn-ruleta').addEventListener('click', () => {
            const mensaje = document.getElementById('msg-ruleta');
            mensaje.innerText = "Girando...";
            
            setTimeout(() => {
                let probabilidad = Math.random(); // Número entre 0 y 1
                
                if (probabilidad < 0.30) { 
                    // 30% de probabilidad: CASTIGO (Shock)
                    mensaje.innerText = "¡ZAP! Castigo eléctrico.";
                    mensaje.style.color = "#cf6679";
                    disparar(1, 1500); 
                } else {
                    // 70% de probabilidad: PREMIO (Vibración)
                    mensaje.innerText = "Te salvaste. Vibración suave.";
                    mensaje.style.color = "#03dac6";
                    disparar(0, 3000);
                }
            }, 1000); // 1 segundo de suspenso
        });
    </script>
</body>
</html>
