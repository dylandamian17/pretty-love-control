<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Directo BLE - Pretty Love</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; max-width: 400px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { width: 100%; padding: 18px; margin: 8px 0; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-conn { background: #03dac6; color: #000; margin-bottom: 15px; }
        .btn-lvl { background: #3700b3; color: #fff; }
        .btn-off { background: #cf6679; color: #000; margin-top: 15px; }
        #status { margin-top: 15px; font-weight: bold; color: #bb86fc; font-size: 14px; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h2>Control Bluetooth Directo</h2>
    
    <button class="btn-conn" onclick="conectarBluetooth()">1. Conectar por Bluetooth</button>

    <h3>Niveles</h3>
    <button class="btn-lvl" onclick="enviarVelocidad(1)">Nivel 1</button>
    <button class="btn-lvl" onclick="enviarVelocidad(2)">Nivel 2</button>
    <button class="btn-lvl" onclick="enviarVelocidad(3)">Nivel 3 (Máximo)</button>

    <button class="btn-off" onclick="enviarVelocidad(0)">Apagar</button>

    <div id="status">Desconectado</div>
</div>

<script>
    let dispositivoBLE = null;
    let caracteristicaEscritura = null;

    async function conectarBluetooth() {
        const status = document.getElementById('status');
        try {
            status.innerText = "Buscando dispositivo...";
            
            // Filtro abierto para detectar el chip Aogu / Pretty Love sin bloqueos
            dispositivoBLE = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [
                    '0000ffe0-0000-1000-8000-00805f9b34fb', 
                    '0000ffe5-0000-1000-8000-00805f9b34fb',
                    '0000fff0-0000-1000-8000-00805f9b34fb'
                ]
            });

            status.innerText = "Conectando al perfil de red...";
            const servidorGATT = await dispositivoBLE.gatt.connect();
            
            status.innerText = "Buscando canales de comunicación...";
            const servicios = await servidorGATT.getPrimaryServices();
            
            for (let servicio of servicios) {
                const caracteristicas = await servicio.getCharacteristics();
                for (let carac of caracteristicas) {
                    // Buscamos específicamente el canal que permite enviar comandos (Write)
                    if (carac.properties.write || carac.properties.writeWithoutResponse) {
                        caracteristicaEscritura = carac;
                        break;
                    }
                }
                if (caracteristicaEscritura) break;
            }

            if (caracteristicaEscritura) {
                status.innerText = "¡Conectado directamente con éxito!";
            } else {
                status.innerText = "Error: El dispositivo se conectó pero no expone canales de control.";
            }

        } catch (error) {
            console.error(error);
            status.innerText = "Error de conexión: " + error.message;
        }
    }

    async function enviarVelocidad(nivel) {
        if (!caracteristicaEscritura) {
            alert("Primero presiona 'Conectar por Bluetooth'.");
            return;
        }
        try {
            // Estructura de bytes hexadecimales exacta para el protocolo Aogu / Pretty Love
            // Mapeo: [Cabecera de comando de motor, Nivel de intensidad (0 a 3)]
            const bufferComando = new Uint8Array([0x01, nivel]);
            
            await caracteristicaEscritura.writeValue(bufferComando);
            document.getElementById('status').innerText = "Enviado - Nivel: " + nivel;
        } catch (error) {
            console.error("Fallo al enviar:", error);
            // Intento secundario con trama alternativa de un solo byte si falla el búfer doble
            try {
                const bufferAlt = new Uint8Array([nivel]);
                await caracteristicaEscritura.writeValue(bufferAlt);
                document.getElementById('status').innerText = "Enviado (Alt) - Nivel: " + nivel;
            } catch (errAlt) {
                status.innerText = "Error al enviar la orden al dispositivo.";
            }
        }
    }
</script>
</body>
</html>
