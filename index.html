<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control BDSM - v4 (Debug)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .caja { background: #1e1e1e; padding: 20px; border-radius: 10px; margin: 15px auto; max-width: 400px; }
        button { background: #6200ea; color: white; border: none; padding: 15px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 10px; }
        button:active { background: #3700b3; }
        button:disabled { background: #555; cursor: not-allowed; }
        .peligro { background: #cf6679; }
        .peligro:active { background: #b00020; }
        input[type=range] { width: 100%; margin: 15px 0; }
        #controles { display: none; }
        #estado { font-style: italic; color: #03dac6; margin-bottom: 20px; font-size: 14px; }
        
        /* Estilos del Logger */
        #zona-debug { margin-top: 30px; background: #000; padding: 15px; border-radius: 8px; text-align: left; }
        textarea { width: 100%; height: 150px; background: #222; color: #0f0; font-family: monospace; border: 1px solid #444; padding: 10px; box-sizing: border-box; }
        #btn-copiar { background: #03dac6; color: #000; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Panel BDSM - Pretty Love</h2>
    
    <div id="estado">Iniciando motor interno (WASM)... por favor espera.</div>
    <button id="btn-conectar" disabled>Vincular Juguete</button>

    <div id="controles">
        <div class="caja">
            <label>Intensidad Vibración: <span id="val-vib">50</span>%</label>
            <input type="range" id="rango-vib" min="1" max="100" value="50">
            <button id="btn-vibrar">Vibrar (2s)</button>
        </div>

        <div class="caja">
            <label>Intensidad Shock: <span id="val-shock">30</span>%</label>
            <input type="range" id="rango-shock" min="1" max="100" value="30">
            <button id="btn-shock" class="peligro">Shock Eléctrico (1s)</button>
        </div>
        <button id="btn-detener" style="background: #333;">Detener Todo</button>
    </div>

    <!-- ZONA DE DEBUGGING -->
    <div id="zona-debug">
        <h3>📋 Log de Sistema</h3>
        <textarea id="log-salida" readonly></textarea>
        <button id="btn-copiar">Copiar Log para enviarlo</button>
    </div>

    <script type="module">
        import { ButtplugClient } from "https://cdn.jsdelivr.net/npm/buttplug@3.2.1/dist/web/buttplug.mjs";
        import { ButtplugWasmClientConnector } from "https://cdn.jsdelivr.net/npm/buttplug-wasm@2.0.1/dist/buttplug-wasm.mjs";

        let cliente = null;
        let jugueteActivo = null;

        // --- SISTEMA DE LOGGING ---
        const cajaLog = document.getElementById('log-salida');
        function agregarLog(mensaje, objeto = null) {
            let logFinal = `[${new Date().toLocaleTimeString()}] ${mensaje}`;
            if (objeto) {
                try {
                    // Extraer propiedades reales del objeto aunque tenga prototipos ocultos
                    let objLimpio = {};
                    for (let key in objeto) {
                        if (typeof objeto[key] !== 'function') objLimpio[key] = objeto[key];
                    }
                    logFinal += "\n" + JSON.stringify(objLimpio, null, 2);
                } catch(e) {
                    logFinal += "\n[Objeto no se pudo formatear]";
                }
            }
            cajaLog.value += logFinal + "\n\n";
            cajaLog.scrollTop = cajaLog.scrollHeight; // Auto-scroll
        }

        document.getElementById('btn-copiar').addEventListener('click', () => {
            cajaLog.select();
            document.execCommand('copy');
            agregarLog("¡Log copiado al portapapeles!");
        });
        // --------------------------

        document.getElementById('rango-vib').oninput = function() { document.getElementById('val-vib').innerText = this.value; }
        document.getElementById('rango-shock').oninput = function() { document.getElementById('val-shock').innerText = this.value; }

        async function initMotor() {
            agregarLog("Iniciando ButtplugClient...");
            try {
                cliente = new ButtplugClient("App BDSM");
                const conector = new ButtplugWasmClientConnector();
                await cliente.connect(conector);
                agregarLog("Motor WASM conectado. Esperando interacción.");

                cliente.addListener("deviceadded", async (dispositivo) => {
                    jugueteActivo = dispositivo;
                    
                    // Aquí capturamos cómo se llama realmente y qué tiene adentro
                    let nombreReal = dispositivo.name || dispositivo.Name || "Desconocido";
                    document.getElementById('estado').innerText = `Conectado: ${nombreReal}`;
                    document.getElementById('estado').style.color = "#03dac6";
                    
                    agregarLog(`¡Dispositivo Vinculado!: ${nombreReal}`, dispositivo);
                    agregarLog(`Atributos de vibración disponibles: ${dispositivo.vibrateAttributes ? dispositivo.vibrateAttributes.length : 'Ninguno'}`);

                    document.getElementById('controles').style.display = "block";
                    document.getElementById('btn-conectar').style.display = "none";
                    await cliente.stopScanning(); 
                });

                document.getElementById('estado').innerText = "Motor listo. Enciende el juguete y presiona Vincular.";
                document.getElementById('btn-conectar').disabled = false;

            } catch (error) {
                agregarLog("Error Crítico al cargar motor: " + error.message);
            }
        }

        document.getElementById('btn-conectar').addEventListener('click', async () => {
            try {
                agregarLog("Solicitando ventana de Bluetooth a Chrome...");
                await cliente.startScanning();
            } catch (error) {
                agregarLog("Error escaneando: " + error.message);
            }
        });

        async function disparar(actuador, tiempoMs) {
            if (!jugueteActivo) return;
            let intensidad = (actuador === 0) ? document.getElementById('rango-vib').value / 100 : document.getElementById('rango-shock').value / 100;
            
            agregarLog(`Intentando accionar Actuador ${actuador} a ${intensidad*100}%`);
            
            try {
                // Probamos el formato estándar
                await jugueteActivo.vibrate([{ Index: actuador, Speed: intensidad }]);
                agregarLog(`Éxito. Deteniendo en ${tiempoMs}ms...`);
                
                setTimeout(async () => {
                    try { await jugueteActivo.stop(); } catch(e) { agregarLog("Error al detener: " + e.message); }
                }, tiempoMs);
                
            } catch (error) {
                agregarLog(`ERROR AL VIBRAR: ${error.message}`);
                
                // Intento de rescate: Formato viejo
                try {
                    agregarLog("Intentando método de rescate (formato simple)...");
                    await jugueteActivo.vibrate(intensidad);
                } catch(e2) {
                    agregarLog(`ERROR FATAL DE RESCATE: ${e2.message}`);
                }
            }
        }

        document.getElementById('btn-vibrar').addEventListener('click', () => disparar(0, 2000));
        document.getElementById('btn-shock').addEventListener('click', () => disparar(1, 1000));
        document.getElementById('btn-detener').addEventListener('click', async () => { 
            if(jugueteActivo) {
                agregarLog("Deteniendo de emergencia...");
                await jugueteActivo.stop(); 
            }
        });

        initMotor();
    </script>
</body>
</html>
