<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluetooth Directo - Pretty Love</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; max-width: 400px; margin: 0 auto; padding: 20px; border-radius: 12px; }
        button { width: 100%; padding: 16px; margin: 8px 0; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-conn { background: #03dac6; color: #000; }
        .btn-lvl { background: #3700b3; color: #fff; }
        .btn-off { background: #cf6679; color: #000; margin-top: 15px; }
        #status { margin-top: 15px; font-weight: bold; color: #bb86fc; }
    </style>
</head>
<body>

<div class="card">
    <h2>Control BLE Directo</h2>
    
    <button class="btn-conn" onclick="conectarBLE()">1. Conectar por Bluetooth</button>

    <h3>Niveles</h3>
    <button class="btn-lvl" onclick="enviarComando(0x01)">Nivel 1</button>
    <button class="btn-lvl" onclick="enviarComando(0x02)">Nivel 2</button>
    <button class="btn-lvl" onclick="enviarComando(0x03)">Nivel 3 (Máximo)</button>

    <button class="btn-off" onclick="enviarComando(0x00)">Apagar</button>

    <div id="status">Desconectado</div>
</div>

<script>
    let bluetoothDevice;
    let bluetoothServer;
    let targetCharacteristic;

    // UUIDs genéricos estándar para chips BLE de control de motores / Aogu
    // (Nota: Si el servicio exacto varía, se puede escanear por nombre o servicios genéricos)
    const SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
    const CHARACTERISTIC_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

    async function conectarBLE() {
        const status = document.getElementById('status');
        try {
            status.innerText = "Buscando dispositivos...";
            
            // Solicita vincular por Bluetooth nativo filtrando por nombres comunes de estos chips
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [
                    { namePrefix: 'Aogu' },
                    { namePrefix: 'Pretty' },
                    { namePrefix: 'HL' },
                    { services: [SERVICE_UUID] }
                ],
                optionalServices: [SERVICE_UUID]
            });

            status.innerText = "Conectando al perfil BLE...";
            bluetoothServer = await bluetoothDevice.gatt.connect();
            
            const service = await bluetoothServer.getPrimaryService(SERVICE_UUID);
            targetCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            status.innerText = "¡Conectado directamente!";
        } catch (error) {
            console.error(error);
            status.innerText = "Error: " + error.message;
        }
    }

    async function enviarComando(nivel) {
        if (!targetCharacteristic) {
            alert("Primero conéctate por Bluetooth.");
            return;
        }
        try {
            // Estructura de bytes básica para enviar la orden de velocidad al chip
            // El formato varía según el sub-protocolo exacto del fabricante (ej: [0x0b, nivel])
            const comando = new Uint8Array([0x0b, nivel]);
            await targetCharacteristic.writeValue(comando);
            document.getElementById('status').innerText = "Enviado nivel: " + nivel;
        } catch (error) {
            console.error("Fallo al enviar comando:", error);
        }
    }
</script>
</body>
</html>
