<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pretty Love - Control Nativo BLE</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; max-width: 400px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { width: 100%; padding: 16px; margin: 8px 0; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-conn { background: #03dac6; color: #000; }
        .btn-lvl { background: #3700b3; color: #fff; }
        .btn-off { background: #cf6679; color: #000; margin-top: 15px; }
        #status { margin-top: 15px; font-weight: bold; color: #bb86fc; font-size: 13px; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h2>Pretty Love Directo</h2>
    
    <button class="btn-conn" onclick="conectarBLE()">1. Conectar por Bluetooth</button>

    <h3>Niveles de Motor</h3>
    <button class="btn-lvl" onclick="enviarComandoAogu(1)">Nivel 1</button>
    <button class="btn-lvl" onclick="enviarComandoAogu(2)">Nivel 2</button>
    <button class="btn-lvl" onclick="enviarComandoAogu(3)">Nivel 3 (Máximo)</button>

    <button class="btn-off" onclick="enviarComandoAogu(0)">Apagar</button>

    <div id="status">Desconectado</div>
</div>

<script>
    let bluetoothDevice;
    let targetCharacteristic = null;

    // UUID oficial del servicio Aogu / Pretty Love documentado en buttplug-device-config
    const AOGU_SERVICE_UUID = '0000ffe5-0000-1000-8000-00805f9b34fb';

    async function conectarBLE() {
        const status = document.getElementById('status');
        try {
            status.innerText = "Buscando Aogu BLE...";
            
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'Aogu' }, { namePrefix: 'Pretty' }],
                optionalServices: [AOGU_SERVICE_UUID, '0000ffe0-0000-1000-8000-00805f9b34fb']
            });

            status.innerText = "Conectando al GATT...";
            const server = await bluetoothDevice.gatt.connect();
            
            status.innerText = "Buscando servicio Aogu...";
            let service;
            try {
                service = await server.getPrimaryService(AOGU_SERVICE_UUID);
            } catch (e) {
                // Fallback al servicio genérico FFE0 si el primario varía por firmware
                service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
            }

            const characteristics = await service.getCharacteristics();
            for (let characteristic of characteristics) {
                if (characteristic.properties.write || characteristic.properties.writeWithoutResponse) {
                    targetCharacteristic = characteristic;
                    break;
                }
            }

            if (targetCharacteristic) {
                status.innerText = "¡Conectado con éxito al hardware!";
            } else {
                status.innerText = "Conectado pero sin canal de escritura válido.";
            }

        } catch (error) {
            console.error(error);
            status.innerText = "Error: " + error.message;
        }
    }

    async function enviarComandoAogu(nivel) {
        if (!targetCharacteristic) {
            alert("Conéctate primero al dispositivo.");
            return;
        }
        try {
            // Estructura de bytes nativa del protocolo Aogu para control de velocidad escalonada
            // Formato operativo mapeado: [Cabecera de control de motor, Nivel de intensidad]
            const comando = new Uint8Array([0x01, nivel]);
            await targetCharacteristic.writeValue(comando);
            document.getElementById('status').innerText = "Comando enviado - Nivel: " + nivel;
        } catch (error) {
            console.error(error);
            // Intento secundario con trama alternativa de búfer único
            try {
                const comandoAlt = new Uint8Array([0x0b, nivel]);
                await targetCharacteristic.writeValue(comandoAlt);
                document.getElementById('status').innerText = "Enviado (Alt) - Nivel: " + nivel;
            } catch (errAlt) {
                status.innerText = "Fallo al enviar comando al chip.";
            }
        }
    }
</script>
</body>
</html>
