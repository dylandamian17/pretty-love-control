<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control BLE Directo - Pretty Love</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; max-width: 400px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { width: 100%; padding: 16px; margin: 8px 0; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        .btn-conn { background: #03dac6; color: #000; }
        .btn-lvl { background: #3700b3; color: #fff; }
        .btn-off { background: #cf6679; color: #000; margin-top: 15px; }
        #status { margin-top: 15px; font-weight: bold; color: #bb86fc; font-size: 13px; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h2>Probador de Protocolo BLE</h2>
    
    <button class="btn-conn" onclick="conectarBLE()">1. Conectar por Bluetooth</button>

    <h3>Probar Niveles</h3>
    <button class="btn-lvl" onclick="probarComandos(3)">Activar Nivel Máximo</button>
    <button class="btn-off" onclick="probarComandos(0)">Apagar Todo</button>

    <div id="status">Desconectado</div>
</div>

<script>
    let bluetoothDevice;
    let targetCharacteristic = null;

    async function conectarBLE() {
        const status = document.getElementById('status');
        try {
            status.innerText = "Buscando dispositivo...";
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [
                    '0000ffe0-0000-1000-8000-00805f9b34fb', 
                    '0000fff0-0000-1000-8000-00805f9b34fb',
                    '0000ffe5-0000-1000-8000-00805f9b34fb'
                ]
            });

            status.innerText = "Conectando al GATT...";
            const server = await bluetoothDevice.gatt.connect();
            
            status.innerText = "Buscando canales...";
            const services = await server.getPrimaryServices();
            
            for (let service of services) {
                const characteristics = await service.getCharacteristics();
                for (let characteristic of characteristics) {
                    if (characteristic.properties.write || characteristic.properties.writeWithoutResponse) {
                        targetCharacteristic = characteristic;
                        break;
                    }
                }
                if (targetCharacteristic) break;
            }

            if (targetCharacteristic) {
                status.innerText = "¡Conectado! Listo para probar paquetes.";
            } else {
                status.innerText = "Error: Sin canal de escritura.";
            }
        } catch (error) {
            status.innerText = "Error: " + error.message;
        }
    }

    async function probarComandos(val) {
        if (!targetCharacteristic) {
            alert("Conéctate primero.");
            return;
        }

        // Lista de los formatos de paquetes más comunes en chips Aogu / Lovense / Pretty Love genéricos
        const payloads = [
            new Uint8Array([0x0b, val]),             // Formato 1: [0x0B, valor]
            new Uint8Array([0x55, val]),             // Formato 2: [0x55, valor]
            new Uint8Array([0x01, val]),             // Formato 3: [0x01, valor]
            new Uint8Array([val]),                   // Formato 4: Solo el valor directo [valor]
            new Uint8Array([0xaa, 0x01, val]),       // Formato 5: Paquete largo con cabecera
            new TextEncoder().encode("VIBRATE:" + val) // Formato 6: Texto plano
        ];

        const status = document.getElementById('status');
        
        for (let i = 0; i < payloads.length; i++) {
            try {
                status.innerText = `Probando paquete #${i + 1} (Valor: ${val})...`;
                await targetCharacteristic.writeValue(payloads[i]);
                // Espera 400ms entre cada intento para ver si responde
                await new Promise(r => setTimeout(r, 400));
            } catch (e) {
                console.log(`Paquete ${i + 1} falló:`, e);
            }
        }
        
        status.innerText = `¡Prueba de paquetes completada para el valor ${val}! ¿Vibró con alguno?`;
    }
</script>
</body>
</html>
