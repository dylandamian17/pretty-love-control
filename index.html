<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Pretty Love - XToys Webhook</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ff4081;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .control-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #ff4081;
        }
        button {
            background-color: #ff4081;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e03570;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pretty Love Control</h1>
        <p class="status">Webhook ID: <strong>K3odo1pj9DcX</strong></p>

        <div class="control-group">
            <label for="intensityRange">Intensidad: <span id="intensityVal">0</span>%</label>
            <input type="range" id="intensityRange" min="0" max="100" value="0" oninput="updateLabel(this.value)">
        </div>

        <button onclick="sendWebhook()">Enviar Comando</button>
        <button onclick="stopDevice()" style="background-color: #555;">Apagar / Stop</button>
        
        <div id="responseStatus" class="status"></div>
    </div>

    <script>
        const webhookId = "K3odo1pj9DcX";

        function updateLabel(val) {
            document.getElementById('intensityVal').innerText = val;
        }

        async function sendWebhook() {
            const intensity = document.getElementById('intensityRange').value;
            const statusDiv = document.getElementById('responseStatus');
            
            // Estructura de parámetros orientada al webhook de XToys
            const url = `https://webhook.xtoys.app/?id=${webhookId}&v=${intensity}`;

            statusDiv.innerText = "Enviando comando...";

            try {
                // Usamos no-cors por restricciones comunes de origen cruzado en navegadores móviles al disparar webhooks externos
                await fetch(url, { mode: 'no-cors' });
                statusDiv.innerText = `¡Comando enviado! Intensidad: ${intensity}%`;
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Error al conectar con el webhook.";
            }
        }

        async function stopDevice() {
            document.getElementById('intensityRange').value = 0;
            updateLabel(0);
            await sendWebhook();
        }
    </script>

</body>
</html>
