<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pretty Love - Control XToys</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ff4081;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .control-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #ff4081;
            margin-bottom: 10px;
        }
        button {
            background-color: #ff4081;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e03570;
        }
        .btn-secondary {
            background-color: #444;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background-color: #555;
        }
        .status {
            margin-top: 15px;
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pretty Love Control</h1>
        <p class="status" style="margin-top:0;">Webhook ID: <strong>K3odo1pj9DcX</strong></p>

        <!-- Canal 1: Vibración -->
        <div class="control-card">
            <label for="val1">Canal 1 (Vib.): <span id="label1">0</span>%</label>
            <input type="range" id="val1" min="0" max="100" value="0" oninput="updateVal(1, this.value)">
            <button onclick="sendChannel(1)">Enviar Canal 1</button>
        </div>

        <!-- Canal 2: E-Stim -->
        <div class="control-card">
            <label for="val2">Canal 2 (E-S): <span id="label2">0</span>%</label>
            <input type="range" id="val2" min="0" max="100" value="0" oninput="updateVal(2, this.value)">
            <button onclick="sendChannel(2)">Enviar Canal 2</button>
        </div>

        <!-- Botón Global de Parada -->
        <button onclick="stopAll()" class="btn-secondary">Apagar Todo (Stop)</button>
        
        <div id="responseStatus" class="status"></div>
    </div>

    <script>
        const webhookId = "K3odo1pj9DcX";

        function updateVal(channel, val) {
            document.getElementById(`label${channel}`).innerText = val;
        }

        async function sendChannel(channel) {
            const val = document.getElementById(`val${channel}`).value;
            const statusDiv = document.getElementById('responseStatus');
            
            // Se incluye obligatoriamente 'action=trigger' junto al id, canal e intensidad
            const url = `https://webhook.xtoys.app/?id=${webhookId}&action=trigger&channel=${channel}&intensity=${val}&value=${val}`;

            statusDiv.innerText = `Enviando Canal ${channel} (${val}%)...`;

            try {
                await fetch(url, { mode: 'no-cors' });
                statusDiv.innerText = `¡Comando enviado (Canal ${channel}: ${val}%)!`;
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Error al conectar con el webhook.";
            }
        }

        async function stopAll() {
            document.getElementById('val1').value = 0;
            document.getElementById('val2').value = 0;
            updateVal(1, 0);
            updateVal(2, 0);

            const statusDiv = document.getElementById('responseStatus');
            const url = `https://webhook.xtoys.app/?id=${webhookId}&action=trigger&channel=all&intensity=0&value=0`;

            statusDiv.innerText = "Apagando dispositivos...";

            try {
                await fetch(url, { mode: 'no-cors' });
                statusDiv.innerText = "¡Dispositivos apagados!";
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "Error al apagar.";
            }
        }
    </script>

</body>
</html>
